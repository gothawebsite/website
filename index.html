<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GOTHA — Something Revolutionary is Coming (30-Day Countdown)</title>
  <meta name="description" content="GOTHA is launching soon. 30 days remaining until the reveal of next-generation logistics and supply chain intelligence.">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preload" as="video" type="video/mp4" href="./bg%20video.mp4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #07080a;
      --surface: rgba(18, 20, 26, 0.65);
      --surface-border: rgba(255, 255, 255, 0.1);
      --surface-hover: rgba(255, 255, 255, 0.16);
      --accent: #ff4d2e;
      --accent-glow: rgba(255, 77, 46, 0.4);
      --accent-warm: #ff8c42;
      --cream: #fbf9f4;
      --muted: #9ba0aa;
      --text: #f0f2f5;
      --font-main: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'Space Grotesk', ui-monospace, SFMono-Regular, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-main);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Fullscreen Viewport & Background Video */
    .viewport {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    video.bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      background: var(--bg);
      transform: scale(1.03);
      filter: brightness(0.65) contrast(1.1);
      animation: subtlePan 30s ease-in-out infinite alternate;
    }

    @keyframes subtlePan {
      from { transform: scale(1.03); }
      to { transform: scale(1.08); }
    }

    /* Atmospheric cinematic overlays */
    .cinematic-tint {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 45%, rgba(7, 8, 10, 0.45) 0%, rgba(7, 8, 10, 0.85) 75%, #07080a 100%),
                  linear-gradient(to bottom, rgba(7, 8, 10, 0.6) 0%, transparent 35%, rgba(7, 8, 10, 0.75) 70%, #07080a 100%);
      pointer-events: none;
      z-index: 1;
    }

    .scanline-grid {
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                  linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      opacity: 0.6;
      z-index: 2;
    }

    canvas#particle-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 3;
    }

    /* Main Container & Page Layout */
    .page-container {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(20px, 3.5vh, 40px) clamp(20px, 5vw, 64px);
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Header Nav */
    header.site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      width: 100%;
      animation: fadeInDown 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: clamp(24px, 2.5vw, 32px);
      font-weight: 900;
      letter-spacing: -0.04em;
      color: #fff;
      text-decoration: none;
    }

    .brand-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 16px var(--accent), 0 0 30px var(--accent);
      animation: pulseDot 2s ease-in-out infinite;
      margin-left: 2px;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.4); opacity: 1; filter: brightness(1.3); }
    }

    /* Main Content Stage */
    main.hero-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 960px;
      margin: auto;
      width: 100%;
      padding-block: clamp(24px, 4vh, 48px);
    }

    /* Headline */
    h1.hero-title {
      font-size: clamp(42px, 6.8vw, 88px);
      font-weight: 900;
      line-height: 1.02;
      letter-spacing: -0.04em;
      color: #fff;
      text-transform: uppercase;
      margin-bottom: clamp(36px, 5.5vh, 64px);
      animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
    }

    .hero-title .gradient-text {
      display: inline-block;
      background: linear-gradient(135deg, #ffffff 10%, #ff8c42 55%, #ff4d2e 90%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 40px rgba(255, 77, 46, 0.3);
    }

    /* Countdown Grid */
    .countdown-wrapper {
      width: 100%;
      max-width: 860px;
      margin-bottom: 0;
      animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
    }

    .countdown-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(10px, 2vw, 22px);
      width: 100%;
    }

    .countdown-card {
      position: relative;
      background: rgba(14, 17, 24, 0.68);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: clamp(16px, 2.2vw, 24px);
      padding: clamp(20px, 3vh, 36px) clamp(10px, 1.5vw, 20px);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.15);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease, box-shadow 0.3s ease;
      overflow: hidden;
    }

    .countdown-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 0%, rgba(255, 77, 46, 0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .countdown-card:hover {
      transform: translateY(-4px) scale(1.02);
      border-color: rgba(255, 77, 46, 0.45);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(255, 77, 46, 0.2);
    }

    .countdown-card .card-glow-line {
      position: absolute;
      top: 0;
      left: 15%;
      right: 15%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.7;
    }

    .countdown-number {
      font-family: var(--font-mono);
      font-size: clamp(40px, 6.2vw, 82px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.03em;
      color: #ffffff;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 255, 255, 0.15);
      margin-bottom: 8px;
      font-variant-numeric: tabular-nums;
      display: inline-block;
      transition: transform 0.18s ease-out;
    }

    .countdown-card.card-seconds .countdown-number {
      color: #ff9d85;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.8), 0 0 35px var(--accent-glow);
    }

    .countdown-label {
      font-family: var(--font-mono);
      font-size: clamp(10px, 1.1vw, 13px);
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* Progress bar */
    .timeline-bar {
      margin-top: 18px;
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 100px;
      height: 6px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .timeline-progress {
      height: 100%;
      width: 72%;
      background: linear-gradient(90deg, var(--accent-warm), var(--accent));
      border-radius: 100px;
      box-shadow: 0 0 14px var(--accent);
      position: relative;
      animation: progressPulse 3s ease-in-out infinite alternate;
    }

    @keyframes progressPulse {
      from { filter: brightness(1); }
      to { filter: brightness(1.3); }
    }

    .timeline-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* Footer */
    footer.site-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      width: 100%;
      padding-top: clamp(16px, 2.5vh, 28px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.65s both;
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .footer-coord {
      color: var(--accent);
    }

    /* Keyframes */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Responsive Queries */
    @media (max-width: 768px) {
      .page-container {
        padding: 20px 18px;
      }

      .countdown-grid {
        gap: 10px;
      }

      .countdown-card {
        padding: 20px 8px;
        border-radius: 14px;
      }

      .countdown-number {
        font-size: 38px;
      }

      .countdown-label {
        font-size: 9.5px;
        letter-spacing: 0.16em;
      }

      footer.site-footer {
        flex-direction: column;
        text-align: center;
        gap: 8px;
      }
    }

    @media (max-width: 480px) {
      .countdown-number {
        font-size: 32px;
      }
    }
  </style>
</head>
<body>
  <!-- Cinematic Fullscreen Video Background -->
  <div class="viewport" aria-hidden="true">
    <video class="bg-video" autoplay muted loop playsinline disablepictureinpicture aria-label="GOTHA Background Video" src="./bg%20video.mp4">
      <source src="./bg%20video.mp4" type="video/mp4">
      <source src="./bg video.mp4" type="video/mp4">
    </video>
    <div class="cinematic-tint"></div>
    <div class="scanline-grid"></div>
    <canvas id="particle-canvas"></canvas>
  </div>

  <!-- Page Interface -->
  <div class="page-container">
    <!-- Header -->
    <header class="site-header">
      <a href="#" class="brand" aria-label="GOTHA Home">
        GOTHA<span class="brand-dot"></span>
      </a>
    </header>

    <!-- Main Stage -->
    <main class="hero-stage">
      <h1 class="hero-title">
        SOMETHING REVOLUTIONARY<br>
        <span class="gradient-text">IS COMING.</span>
      </h1>

      <!-- 30-Day Countdown Cards -->
      <div class="countdown-wrapper" role="timer" aria-label="30 days countdown until launch">
        <div class="countdown-grid">
          <div class="countdown-card">
            <div class="card-glow-line"></div>
            <span class="countdown-number" id="days">30</span>
            <span class="countdown-label">DAYS</span>
          </div>
          <div class="countdown-card">
            <div class="card-glow-line"></div>
            <span class="countdown-number" id="hours">00</span>
            <span class="countdown-label">HOURS</span>
          </div>
          <div class="countdown-card">
            <div class="card-glow-line"></div>
            <span class="countdown-number" id="minutes">00</span>
            <span class="countdown-label">MINUTES</span>
          </div>
          <div class="countdown-card card-seconds">
            <div class="card-glow-line"></div>
            <span class="countdown-number" id="seconds">00</span>
            <span class="countdown-label">SECONDS</span>
          </div>
        </div>

        <!-- Timeline Progress Indicator -->
        <div class="timeline-bar">
          <div class="timeline-progress" id="progress-bar"></div>
        </div>
        <div class="timeline-meta">
          <span>ORIGIN: INITIATION</span>
          <span id="meta-remaining">30 DAYS REMAINING</span>
          <span>TARGET: 14 NOV 2026</span>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
      <div class="footer-left">
        <span>© 2026 GOTHA INC.</span>
        <span>•</span>
        <span class="footer-coord">SYS_ID: 28.6139° N, 77.2090° E</span>
      </div>
      <div>
        <span>ALL SYSTEMS ONLINE & STANDING BY</span>
      </div>
    </footer>
  </div>

  <script>
    // 30-Day Countdown logic targeting 14 November 2026, 3:00 PM IST
    const launchTarget = new Date('2026-11-14T15:00:00+05:30');
    const startAnchor = new Date('2026-10-14T15:00:00+05:30'); // 31 days total window

    const daysEl = document.getElementById('days');
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');
    const progressBar = document.getElementById('progress-bar');
    const metaRemaining = document.getElementById('meta-remaining');

    function updateCountdown() {
      const now = new Date();
      const diff = Math.max(0, launchTarget.getTime() - now.getTime());
      const totalSeconds = Math.floor(diff / 1000);

      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      daysEl.textContent = String(days).padStart(2, '0');
      hoursEl.textContent = String(hours).padStart(2, '0');
      minutesEl.textContent = String(minutes).padStart(2, '0');
      secondsEl.textContent = String(seconds).padStart(2, '0');

      // Micro-animation on second change
      secondsEl.style.transform = 'scale(1.08)';
      setTimeout(() => { secondsEl.style.transform = 'scale(1)'; }, 150);

      // Calculate progress percentage
      const totalSpan = launchTarget.getTime() - startAnchor.getTime();
      const elapsed = Math.max(0, now.getTime() - startAnchor.getTime());
      const percent = Math.min(100, Math.max(5, (elapsed / totalSpan) * 100));
      if (progressBar) progressBar.style.width = percent.toFixed(1) + '%';
      if (metaRemaining) metaRemaining.textContent = `${days} DAYS ${hours}H REMAINING`;
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

    // Floating Dust & Ember Canvas Animation
    const canvas = document.getElementById('particle-canvas');
    if (canvas) {
      const ctx = canvas.getContext('2d');
      let width, height;
      const particles = [];
      const particleCount = 45;

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }

      window.addEventListener('resize', resize);
      resize();

      class Particle {
        constructor() {
          this.reset(true);
        }
        reset(initial = false) {
          this.x = Math.random() * width;
          this.y = initial ? Math.random() * height : height + 10;
          this.size = Math.random() * 2 + 0.6;
          this.speedY = Math.random() * 0.45 + 0.15;
          this.speedX = (Math.random() - 0.5) * 0.35;
          this.opacity = Math.random() * 0.5 + 0.2;
          this.isWarm = Math.random() > 0.65;
        }
        update() {
          this.y -= this.speedY;
          this.x += this.speedX;
          if (this.y < -10) this.reset();
        }
        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = this.isWarm 
            ? `rgba(255, 120, 60, ${this.opacity})` 
            : `rgba(255, 255, 255, ${this.opacity * 0.7})`;
          ctx.fill();
        }
      }

      for (let i = 0; i < particleCount; i++) {
        particles.push(new Particle());
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);
        particles.forEach(p => {
          p.update();
          p.draw();
        });
        requestAnimationFrame(animate);
      }
      animate();
    }
  </script>
</body>
</html>
